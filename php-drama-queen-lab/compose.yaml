services:
  before:
    build:
      context: .
      dockerfile: Dockerfile.before
      args:
        PHP_IMAGE: ${PHP_BEFORE_IMAGE:-php@sha256:60111400ff77bdc44fa79b4f072afe49a42abba71e0846ad496be4761dc9c11a}
    ports:
      - "127.0.0.1::80"
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 96
    security_opt:
      - no-new-privileges:true
  after:
    build:
      context: .
      dockerfile: Dockerfile.after
      args:
        PHP_IMAGE: ${PHP_AFTER_IMAGE:-php@sha256:c6527b06c772a2c3cae648ce58c23a2a12ed2fed41cdfb0619ea64be008cc601}
    ports:
      - "127.0.0.1::80"
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 96
    security_opt:
      - no-new-privileges:true
